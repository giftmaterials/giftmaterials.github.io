<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIFT Project Page</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { display: grid; min-height: 100vh; place-items: center; margin: 0; background: #f5f7fa; color: #16233a; }
    main { width: min(680px, calc(100% - 40px)); padding: 42px; background: #fff; border: 1px solid #dbe1e8; text-align: center; box-shadow: 0 12px 34px rgba(22, 35, 58, .08); }
    h1 { margin: 0 0 14px; font-size: 2rem; }
    p { margin: 8px 0; color: #5f6d7f; line-height: 1.6; }
    code { padding: 3px 7px; background: #eef2f5; border-radius: 4px; color: #2f6f9f; }
  </style>
</head>
<body>
  <main>
    <h1>GIFT project page</h1>
    <p>This test page is online and ready for future content.</p>
    <p>GitHub Pages account: <code>giftmaterials</code></p>
  </main>
</body>
</html>
